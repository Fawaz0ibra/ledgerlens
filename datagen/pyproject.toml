[project]
name = "ledgerlens-datagen"
# Raised whenever the same seed would give different files. Each dataset records the version that made it
# (dataset.json), so two datasets with the same seed and version are the same data. 0.2.0: field boxes.
version = "0.2.0"
description = "Seeded synthetic bilingual Arabic/English ZATCA-style invoices with ground-truth labels, for testing LedgerLens."
license = "Apache-2.0"
authors = [
    { name = "Fawaz Ibra", email = "129978738+Fawaz0ibra@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    # The invoice contract. Every generated invoice is a ledgerlens.contracts Invoice, so the generator
    # can't drift from what the API accepts.
    "ledgerlens",
    # Rendering (ADR 0006): the HTML template, the QR image, and headless Chromium for the PDF and PNG.
    # Playwright also needs its browser, installed separately (README, "Synthetic invoices").
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "playwright==1.64.1",
    "segno==1.6.6",
]

[project.scripts]
ledgerlens-datagen = "ledgerlens_datagen.cli:main"

[tool.uv.sources]
ledgerlens = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
