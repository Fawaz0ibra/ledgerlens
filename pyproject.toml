[project]
name = "ledgerlens"
version = "0.1.0"
description = "An AI platform that reads supplier invoices, checks them and flags problems."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Fawaz Ibra", email = "129978738+Fawaz0ibra@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
