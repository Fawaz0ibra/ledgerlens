[project]
name = "ledgerlens"
version = "0.1.0"
description = "An AI platform that reads supplier invoices, checks them and flags problems."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Fawaz Ibra", email = "129978738+Fawaz0ibra@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# A uv workspace: this package (the API) and the invoice generator in datagen/ are separate packages with
# their own dependencies, resolved together into the one uv.lock (ADR 0005).
[tool.uv.workspace]
members = ["datagen"]

[tool.uv.sources]
ledgerlens-datagen = { workspace = true }

[tool.pytest]
testpaths = ["tests", "datagen/tests"]
# -ra: after the run, list every test that didn't pass, with the reason.
addopts = ["-ra"]
# Every warning fails the run. A deprecation shows up the day it appears, not the day the feature is removed.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ledgerlens", "ledgerlens_datagen"]
# Count both outcomes of every if, not just whether the line ran.
branch = true
# Playwright's synchronous API runs our code inside greenlets (lightweight threads); without this,
# coverage doesn't see the lines that run there.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
# Every line and branch must run under the tests. A line that truly can't gets "# pragma: no cover"
# with a reason, so the exception is visible in review.
fail_under = 100

[tool.ruff]
# Our code is written to about 120 columns. The formatter wraps code at this width; it leaves comments alone.
# No rule list: we use ruff's own default rules as they are.
line-length = 120
# Where our own packages live, so ruff sorts their imports as ours, after third-party ones.
src = ["src", "datagen/src"]

[tool.mypy]
# tools/ is left out: its scripts need PyTorch, which isn't in this environment.
files = ["src", "tests", "scripts", "datagen/src", "datagen/tests"]
# Every function needs type hints, and mypy checks inside every function. Without strict, mypy doesn't
# look inside a function that has no hints at all.
strict = true
# Teaches mypy how Pydantic models are built, so Model(...) calls are checked too.
plugins = ["pydantic.mypy"]

# pypdfium2 has type hints but doesn't mark itself as typed (no py.typed file), so mypy would skip it and
# treat everything from it as Any. The override tells mypy to read its hints anyway; a few of its functions
# have none, and untyped_calls_exclude lets strict mode call those.
untyped_calls_exclude = ["pypdfium2"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
# Model(...) is checked against the real field types, and an unknown field name is an error.
init_typed = true
init_forbid_extra = true

[dependency-groups]
# The development environment holds every workspace package, so one `uv sync` gives tests and type checks
# all the code. The API image installs with --no-dev, so it never gets the generator.
dev = [
    "httpx2==2.16.0",
    "ledgerlens-datagen",
    "mypy==2.4.1",
    "pypdfium2==5.14.0",  # reads the generator's PDFs in tests
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
]
