# Checks that run on every `git commit`, before the commit is created.
# Set up once per clone:  uv tool install pre-commit==4.7.0 && pre-commit install
# Each rev is a commit hash, not a tag: a tag can be moved to other code, a hash can't.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks  # scans the staged changes for keys and tokens; blocks the commit if it finds one

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files  # stops datasets and model weights (> 500 kB) from entering git
      - id: mixed-line-ending  # backs up .gitattributes: LF only
        args: [--fix=lf]
      - id: end-of-file-fixer  # every file ends with exactly one newline
      - id: trailing-whitespace  # no invisible spaces at line ends, which make noisy diffs
      - id: check-merge-conflict  # no leftover <<<<<<< markers from a merge
      - id: check-yaml  # YAML and TOML files must parse, so broken config never gets committed
      - id: check-toml
